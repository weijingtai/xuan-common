name: xuan-common Flash DevOps
on: [push, pull_request]

jobs:
  # 任务 1: 极速代码检查 (使用原生 Dart 工具)
  lint:
    name: Flutter Lint
    runs-on: linux
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Dart Analyze
        run: flutter analyze > lint-report.txt

      - name: Upload Lint Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-lint-report
          path: lint-report.txt

  # 任务 2: 安全扫描 (动态安装)
  security:
    name: Security Scan
    runs-on: linux
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin v0.48.3

      - name: Scan Repository
        run: |
          trivy fs --format json --output trivy-report.json .

      - name: Upload Security Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: trivy-report.json

  # 任务 3: E2E 测试
  e2e-test:
    name: E2E Tests
    runs-on: linux
    needs: [lint, security]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          cd test/e2e
          npm install
          npx playwright install --with-deps chromium

      - name: Run Tests
        run: |
          cd test/e2e
          npm test

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test/e2e/playwright-report/

      - name: Notify GitNexus
        if: always()
        run: |
          curl -X POST http://192.168.0.165:4747/api/analyze -d '{"path": "/gitea-repos/xuan/xuan-common.git"}'
