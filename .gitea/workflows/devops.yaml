name: devops
on: [push, pull_request]

jobs:
  lint:
    name: lint
    runs-on: linux
    container:
      image: xuan-devops:v1
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Get Dependencies
        run: flutter pub get

      - name: Dart Analyze
        run: flutter analyze > lint-report.txt || true

      - name: Upload Lint Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-lint-report
          path: lint-report.txt

  sec:
    name: sec
    runs-on: linux
    container:
      image: xuan-devops:v1
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Scan Repository
        run: |
          trivy fs --exit-code 1 --severity CRITICAL,HIGH --ignore-unfixed .

      - name: Generate Report
        if: always()
        run: |
          trivy fs --format json --output trivy-report.json .

      - name: Upload Security Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: trivy-report.json

  e2e:
    name: e2e
    runs-on: linux
    container:
      image: xuan-devops:v1
    needs: [lint, sec]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Playwright Dependencies
        run: |
          cd test/e2e
          npm install
          npx playwright install --with-deps chromium

      - name: Run Tests
        run: |
          cd test/e2e
          npm test

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test/e2e/playwright-report/

      - name: Notify GitNexus
        if: always()
        run: |
          curl -X POST http://192.168.0.165:4747/api/analyze -d '{"path": "/gitea-repos/xuan/xuan-common.git"}'
