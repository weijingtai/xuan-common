name: devops
on: [push, pull_request]

jobs:
  lint:
    name: 1. 代码规范与依赖解析 (Lint)
    runs-on: linux
    container:
      image: 192.168.0.165:15000/xuan-devops:v1
    steps:
      - name: 🏁 准备工作 (Manual Checkout)
        run: |
          export GIT_TERMINAL_PROMPT=0
          git clone http://token:${{ secrets.GiteaAuth }}@192.168.0.165:3000/${{ github.repository }}.git .
          git checkout ${{ github.sha }}
      
      - name: 🔗 解析内网依赖 (Recursive Resolve)
        shell: python3
        env:
          GITEA_TOKEN: ${{ secrets.GiteaAuth }}
        run: |
          import yaml, os, sys
          try:
              token = os.environ.get('GITEA_TOKEN')
              for root, dirs, files in os.walk("."):
                  if 'pubspec.yaml' in files:
                      with open(os.path.join(root, 'pubspec.yaml'), 'r') as f: pubspec = yaml.safe_load(f)
                      deps = {**(pubspec.get('dependencies', {}) or {}), **(pubspec.get('dev_dependencies', {}) or {})}
                      overrides = {}
                      for pkg, spec in deps.items():
                          if isinstance(spec, dict) and ('path' in spec or 'github.com' in spec.get('git', {}).get('url', '')) or pkg == 'common':
                              repo = pkg.replace('_', '-')
                              if repo == 'common': repo = 'xuan-common'
                              if not repo.startswith('xuan-'): repo = f"xuan-{repo}"
                              actual_pkg = 'xuan_common' if pkg == 'common' else pkg
                              overrides[actual_pkg] = {'git': {'url': f"http://token:{token}@192.168.0.165:3000/xuan/{repo}.git"}}
                      if overrides:
                          with open(os.path.join(root, 'pubspec_overrides.yaml'), 'w') as f: yaml.dump({'dependency_overrides': overrides}, f)
          except Exception as e: print(f"Error: {e}")

      - name: 📦 获取 Flutter 依赖
        run: flutter pub get

      - name: 🔍 代码静态分析
        run: flutter analyze > lint-report.txt || true

  sec:
    name: 2. 安全扫描 (Trivy Scan)
    needs: [lint]
    runs-on: linux
    container:
      image: 192.168.0.165:15000/xuan-devops:v1
    steps:
      - name: 🏁 准备工作 (Manual Checkout)
        run: |
          export GIT_TERMINAL_PROMPT=0
          rm -rf ..?* .[!.]* *
          git clone http://token:${{ secrets.GiteaAuth }}@192.168.0.165:3000/${{ github.repository }}.git .
          git checkout ${{ github.sha }}

      - name: 🛡️ 执行 Trivy 离线扫描
        run: |
          # 明确指向镜像内预制的数据库目录 /opt/trivy_db
          trivy --cache-dir /opt/trivy_db fs --exit-code 0 --severity CRITICAL,HIGH --ignore-unfixed --skip-db-update --offline-scan .

  e2e:
    name: 3. 端到端测试 (E2E Test)
    needs: [sec]
    runs-on: linux
    container:
      image: 192.168.0.165:15000/xuan-devops:v1
    steps:
      - name: 🏁 准备工作 (Manual Checkout)
        run: |
          export GIT_TERMINAL_PROMPT=0
          rm -rf ..?* .[!.]* *
          git clone http://token:${{ secrets.GiteaAuth }}@192.168.0.165:3000/${{ github.repository }}.git .
          git checkout ${{ github.sha }}

      - name: 🎭 运行 Playwright (如果存在)
        run: |
          if [ -d "test/e2e" ]; then
            cd test/e2e
            npm install
            npx playwright install --with-deps chromium
            npm test
          else
            echo "No E2E tests found."
          fi
