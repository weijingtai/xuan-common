name: devops
on: [push, pull_request]

jobs:
  lint:
    name: lint
    runs-on: linux
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y jq

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Dart Analyze
        run: flutter analyze > lint-report.txt || true

      - name: Upload Lint Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-lint-report
          path: lint-report.txt

  sec:
    name: sec
    runs-on: linux
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Trivy
        run: |
          # 放弃官方安装脚本，改用更直接、兼容性更好的二进制下载方式
          wget https://github.com/aquasecurity/trivy/releases/download/v0.48.3/trivy_0.48.3_Linux-64bit.tar.gz
          tar -zxvf trivy_0.48.3_Linux-64bit.tar.gz
          sudo mv trivy /usr/local/bin/

      - name: Scan Repository
        run: |
          trivy fs --exit-code 1 --severity CRITICAL,HIGH --ignore-unfixed .

      - name: Generate Report
        if: always()
        run: |
          trivy fs --format json --output trivy-report.json .

      - name: Upload Security Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: trivy-report.json

  e2e:
    name: e2e
    runs-on: linux
    needs: [lint, sec]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          cd test/e2e
          npm install
          npx playwright install --with-deps chromium

      - name: Run Tests
        run: |
          cd test/e2e
          npm test

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test/e2e/playwright-report/

      - name: Notify GitNexus
        if: always()
        run: |
          curl -X POST http://192.168.0.165:4747/api/analyze -d '{"path": "/gitea-repos/xuan/xuan-common.git"}'
