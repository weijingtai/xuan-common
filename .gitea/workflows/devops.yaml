name: xuan-common Flash DevOps
on: [push, pull_request]

jobs:
  lint:
    name: Lint Code Base
    # 使用 alpine 标签映射到轻量镜像
    runs-on: linux
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Super-Linter
        uses: super-linter/super-linter/slim@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_ALL_CODEBASE: false
          DEFAULT_BRANCH: main
          VALIDATE_DART: true
          VALIDATE_MARKDOWN: true
          VALIDATE_YAML: true

  security:
    name: Security Scan (Lightweight)
    # 直接在官方轻量镜像中运行，不使用复杂的 Action 插件
    runs-on: linux
    container:
      image: aquasec/trivy:latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Scan Repository
        run: |
          trivy fs --exit-code 1 --severity CRITICAL,HIGH --ignore-unfixed .
      - name: Generate Report
        if: always()
        run: |
          trivy fs --format json --output trivy-report.json .
      - name: Upload Security Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: trivy-report.json

  e2e-test:
    name: E2E Tests
    runs-on: linux
    needs: [lint, security]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Build Flutter Web
        run: |
          cd example
          flutter build web

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install E2E Dependencies
        run: |
          cd test/e2e
          npm install

      - name: Install Playwright Browsers
        run: |
          cd test/e2e
          npx playwright install --with-deps chromium

      - name: Run E2E Tests
        run: |
          cd test/e2e
          npm test

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test/e2e/playwright-report/

      - name: Notify GitNexus
        if: always()
        run: |
          curl -X POST http://192.168.0.165:4747/api/analyze -d '{"path": "/gitea-repos/xuan/xuan-common.git"}'
