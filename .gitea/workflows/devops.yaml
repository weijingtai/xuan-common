name: xuan-common Flash DevOps
on: [push, pull_request]

jobs:
  lint:
    name: Lint Code Base
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Super-Linter
        uses: super-linter/super-linter/slim@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_ALL_CODEBASE: false
          DEFAULT_BRANCH: main
          VALIDATE_DART: true
          VALIDATE_MARKDOWN: true
          VALIDATE_YAML: true

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

  e2e-test:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [lint, security]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Build Flutter Web
        run: |
          cd example
          flutter build web

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install E2E Dependencies
        run: |
          cd test/e2e
          npm install

      - name: Install Playwright Browsers
        run: |
          cd test/e2e
          npx playwright install --with-deps chromium

      - name: Run E2E Tests
        run: |
          cd test/e2e
          npm test

      - name: Notify GitNexus
        if: always()
        run: |
          curl -X POST http://192.168.0.165:4747/api/analyze -d '{"path": "/gitea-repos/xuan/xuan-common.git"}'
      
      - name: ZenTao Feedback on Failure
        if: failure()
        run: |
          echo "Triggering zentao-cli to create bug..."
          # Placeholder for zentao-cli command since specific ID needs sync
          # zentao bug create --title "CI Failure in xuan-common" --product 1
