name: devops
on: [push, pull_request]

jobs:
  lint:
    name: lint
    runs-on: linux
    container:
      image: 192.168.0.165:15000/xuan-devops:v1
    steps:
      - name: Manual Checkout
        run: |
          git clone http://xuan:wjt19951215@192.168.0.165:3000/${{ github.repository }}.git .
          git checkout ${{ github.sha }}
      
      - name: Resolve Remaining Internal Dependencies
        shell: python3
        run: |
          import yaml, os, sys
          try:
              if not os.path.exists('pubspec.yaml'): exit(0)
              with open('pubspec.yaml', 'r') as f: pubspec = yaml.safe_load(f)
              deps = {**(pubspec.get('dependencies', {}) or {}), **(pubspec.get('dev_dependencies', {}) or {})}
              overrides = {}
              base_url = "http://192.168.0.165:3000"
              owner = "xuan"
              for pkg, spec in deps.items():
                  # 仅当依然是相对路径或指向 github 时才进行覆盖
                  is_path = isinstance(spec, dict) and 'path' in spec
                  is_github = isinstance(spec, dict) and 'git' in spec and 'github.com' in spec['git'].get('url', '')
                  if is_path or is_github:
                      repo = pkg.replace('_', '-')
                      if not repo.startswith('xuan-') and repo != 'common': repo = f"xuan-{repo}"
                      if repo == 'common': repo = 'xuan-common'
                      overrides[pkg] = {'git': {'url': f"{base_url}/{owner}/{repo}.git"}}
              if overrides:
                  with open('pubspec_overrides.yaml', 'w') as f: yaml.dump({'dependency_overrides': overrides}, f)
                  print(f"Added safety overrides for {list(overrides.keys())}")
          except Exception as e:
              print(f"Safety resolver warning: {e}")

      - name: Get Dependencies
        run: flutter pub get

      - name: Dart Analyze
        run: flutter analyze > lint-report.txt || true
