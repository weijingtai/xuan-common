name: devops
on: [push, pull_request]

jobs:
  lint:
    name: lint
    runs-on: linux
    container:
      image: 192.168.0.165:15000/xuan-devops:v1
    steps:
      - name: Manual Checkout
        run: |
          echo "Repository is: ${{ github.repository }}"
          echo "SHA is: ${{ github.sha }}"
          git clone http://xuan:wjt19951215@192.168.0.165:3000/${{ github.repository }}.git .
          git checkout ${{ github.sha }}
      
      - name: Resolve Internal Dependencies
        shell: python3
        run: |
          import yaml, os, sys, urllib.request, json
          try:
              print("--- Universal Ecosystem Resolver ---")
              base_url = "http://192.168.0.165:3000"
              owner = "xuan"
              auth_header = "Basic eHVhbjp3anQxOTk1MTIxNQ=="
              repo_url = f"{base_url}/api/v1/users/{owner}/repos"
              req = urllib.request.Request(repo_url)
              req.add_header('Authorization', auth_header)
              with urllib.request.urlopen(req) as r: repos = json.load(r)
              all_repo_names = [repo['name'] for repo in repos]
              overrides = {}
              for repo in all_repo_names:
                  gitea_git_url = f"{base_url}/{owner}/{repo}.git"
                  pkg_a = repo.replace('-', '_')
                  pkg_b = repo.replace('xuan-', '').replace('-', '_')
                  for pkg in [pkg_a, pkg_b]: overrides[pkg] = {'git': {'url': gitea_git_url}}
              storage_url = f"{base_url}/{owner}/xuan-storage.git"
              overrides['persistence_core'] = {'git': {'url': storage_url, 'path': 'core'}}
              overrides['persistence_drift'] = {'git': {'url': storage_url, 'path': 'drift'}}
              if overrides:
                  with open('pubspec_overrides.yaml', 'w') as f: yaml.dump({'dependency_overrides': overrides}, f)
                  print(f"Generated {len(overrides)} rules.")
          except Exception as e:
              print(f"Error: {e}")

      - name: Get Dependencies
        run: flutter pub get

      - name: Dart Analyze
        run: flutter analyze > lint-report.txt || true
